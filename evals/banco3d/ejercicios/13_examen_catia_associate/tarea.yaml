id: 13_examen_catia_associate
nombre: Examen de muestra CATIA V5 Associate (Part Design) - Tool Block, preguntas 3 a 6 con su masa
falla_real:
  cita: >-
    No es una falla de Barack: es un ejercicio de calentamiento con respuesta conocida. La lamina 12 del examen da las
    masas (3: 934,78 g; 4: 1027,09 g; 5: 625,00 g; 6: 430,39 g) y la lamina 02 dice que si la respuesta no esta entre
    las opciones, lo mas probable es que el modelo este mal (lamina 05: opcion a menos de 1 %).
  fecha: 2026-10-23
  fuente: >-
    Punto 5d de la tanda del viernes 23/10/2026: AGREGADO_1_CICLO_DE_PRACTICA_23-10.md l.20-23 (carpeta
    viernes-23-plan-sistema de la nube de Ingenieria), que nombra este examen como calentamiento con masas de
    respuesta. El esperado de cada pieza BIEN sale de la lamina 12 del examen, no de una pieza real.
