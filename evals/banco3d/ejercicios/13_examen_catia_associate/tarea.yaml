  mapa: >-
    01 tapa; 02 instrucciones; 03 preguntas 1 y 2 (dibujo: no entran); 04 plano del Tool Block (cotas A, B, C);
    05 pregunta 3; 06 pregunta 4; 07 y 08 plano y vistas 3D de la pregunta 5; 09 pregunta 5; 10 plano de la
    pregunta 6; 11 pregunta 6; 12 respuestas; 13 cierre.
pedido: >-
  Modelar el Tool Block del examen en sus cuatro estados (preguntas 3 a 6: MMGS, 2 decimales, origen libre, agujeros
  pasantes salvo que se muestre otra cosa, material Steel) y que la masa de cada uno caiga a 1 g o menos de la
  respuesta de la lamina 12. Un solo script parametrico (A, B, C y los cortes de las preguntas 5 y 6 como pasos).
preguntas:
  q3: {lamina: "05", A: 81.00, B: 57.00, C: 43.00, masa_esperada_g: 934.78, opciones_g: [1028.33, 118.93, 577.64, 934.78]}
  q4: {lamina: "06", A: 84.00, B: 59.00, C: 45.00, masa_esperada_g: 1027.09}
  q5: {lamina: "09", A: 86.00, B: 58.00, C: 44.00, masa_esperada_g: 625.00}
  q6: {lamina: "11", A: 86.00, B: 58.00, C: 44.00, masa_esperada_g: 430.39, nota: "cotas no mostradas = las de la 5"}
piezas:
  - archivo: bien.py
    esperado: verde
    masas_esperadas_g: {q3: 934.78, q4: 1027.09, q5: 625.00, q6: 430.39}
    nota: >-
      Las cuatro preguntas en un solo STEP, como solidos con nombre q3, q4, q5, q6 (el contrato del banco admite una
      sola BIEN por ejercicio: el veredicto por pregunta sale de las medidas del corrector). Armadas con build123d
      desde el dibujo (no hay STEP del examen); ademas deja un STEP por pregunta (<nombre>__q3.step ...) para abrirlo.
  - archivo: mal_1_q3_sin_agujero_14.py
    esperado: rojo
    falla: "q3 sin el agujero pasante de 14 de la orejeta: pesa 986,81 g, 52,03 g de mas"
    nota: >-
      La diferencia sale a mano, sin el modelo: pi x 7^2 x 43 mm3 x 0,00786 g/mm3 = 52,03 g (el modelo da +52,030:
      volumen +6619,336 mm3). Las otras tres preguntas quedan bien.
  - archivo: mal_2_q5_sin_corte_r41.py
    esperado: rojo
    falla: "q5 sin la ranura de 24 con fondo R41 (seccion M-M sin leer): 798,54 g, 173,54 g de mas"
    nota: >-
      La masa de este mutante la da el modelo, no el examen. Las otras tres preguntas quedan bien (la q6 con su ranura,
      aunque en el examen la 6 sale de la 5).
  - archivo: mal_3_q6_vaciado_sin_paredes.py
    esperado: rojo
    falla: "q6 con el vaciado de 1 TYP derecho hasta la pared de atras, sin la pared de 1 alrededor de la ranura (seccion U-U mal leida): 416,20 g, 14,19 g de menos"
    nota: "La masa de este mutante la da el modelo, no el examen. Las otras tres preguntas quedan bien."
controles:
  - nombre: masa_esperada
    existe: true
    formato: step
    opciones: ["--esperado", "q3=934.78,q4=1027.09,q5=625.00,q6=430.39", "--tolerancia", "1", "--densidad", "7.86"]
    nota: >-
      Las masas de --esperado son las de preguntas (lamina 12). Densidad 7,86 g/cm3: el «Steel» de CATIA V5
      (7860 kg/m3 en el informe que genera CATIA, en la skill cad-design:
      scripts/catia/_casos_fem/informe_completo_ej60.html l.82 y l.94). Tolerancia 1 g: la del pedido del 5d (el
      examen pide 1 % entre opciones).
formatos: [step, stl]
notas: >-
  Ejes de la pieza: x a lo largo de A, y a lo largo de B, z a lo largo de C (z=0 la cara de atras, z=C la del rebaje
  de 19). Lo que el plano dibuja sin acotar se dedujo del dibujo (supuestos), y la masa lo confirma: las cuatro
  preguntas dan a 0,004 g o menos de la lamina 12 (q3 934,782; q4 1027,094; q5 625,003; q6 430,392).
  Supuestos: (1) lamina 04: el centro del R19 no tiene cota; sale de la tangencia con la recta de 10 grados (simbolo
  de tangencia) que arranca en x=14, y de que el arco termina donde empieza el plano superior (29 del borde derecho);
  de las dos soluciones se toma la del dibujo (centro a la izquierda, x 35,54 en la q3). (2) El centro del R29 esta
  sobre la diagonal (la cruz del centro esta dibujada sobre la linea; solo tiene la cota 19 de altura). (3) El R5 es
  tangente al fondo de la orejeta y al R29 (simbolo de tangencia). (4) Lamina 07: el centro del R41 esta sobre la
  vertical del borde derecho (x=A: la cruz y su linea de centro estan ahi, sin cota horizontal); la cota 36 ubica el
  fin del arco sobre la diagonal. (5) Orejas 12 atras y C-36 adelante (8 en la q5), ranura 24; el rebaje de 19 es
  del lado de la oreja de adelante (la planta y la vista lateral coinciden). (6) Lamina 10: el vaciado va desde la
  cara de adelante, con el contorno del bloque derecho (x de A-52 a A, y desde 19) 1 hacia adentro y esquinas vivas,
  hasta dejar 12 atras (seccion U-U); no entra a la ranura: deja 1 alrededor (R42) y 1 delante (z de 36 a 37); sin
  tubo alrededor del agujero de 11 (la vista de frente muestra un solo circulo).
  Limite del control: la masa no ve un espejo (orejas 12 y 8 cambiadas, rebaje del otro lado) ni dos errores que se
  compensan; es un control de lectura del plano, no de forma.
  Dato al margen: entre las opciones de la q3, 118,93 coincide con el volumen de la q3 en cm3 (118,929).
  Cada pieza (las cuatro preguntas) se arma en unos 17 s.
