id: 01_porta_bulon
nombre: Porta-bulon de la plantilla del Insert - lo que queda en el aire al imprimir
falla_real:
  cita: "«nunca usas soportes ni sabes usarlos... no verificaste antes de mandar... siempre lo mismo»"
  fecha: 2026-10-22
  fuente: >-
    memoria project_seguimientos_con_fecha.md, seguimiento 3d-control-voladizos-antes-de-mandar-viernes
    (Fak 22/10 ~15:40, foto de los porta-bulones de la placa v5; segunda vez en el dia). Primera vez: foto de Fak
    22/10 14:33 (techo con agujero en marana), comentario en generador/porta_bulon.py y memoria
    project_plantilla_perforado_insert.md:120.
pedido: >-
  Porta-bulon impreso para un bulon hexagonal M6 x 30 DIN 933: cuerpo de 22 que entra en el agujero de 26 del marco,
  alojamiento hexagonal de 10,4 abierto hacia la cama y agujero pasante de 6,6. Se imprime con el cuerpo abajo y sin
  soportes: nada puede quedar en el aire (puente de mas de 12 mm o punta suelta de mas de 2 mm).
piezas:
  - archivo: bien.py
    esperado: verde
    fuente: "5. 3D/VWA/PATAGONIA - PLANTILLA PERFORADO INSERT/v3 - 2026-10-21 - alineada a la costura (concepto)/generador/casos voladizos (porta-bulon 22-10)/PORTA-BULON M6 hexagonal (puentes escalonados).stl"
    sha256: 220da17910697ca8c8cadb36034672fa3f511d49e5c5989f881b3dac9f5ab812
    nota: >-
      Puentes escalonados (version de las 15:40 de generador/porta_bulon.py). El mismo archivo, con el mismo sha256,
      esta en 'Piezas para imprimir'. NO hay resultado de impresion registrado de esta version: es BIEN por diseno.
  - archivo: mal_1_techo_con_agujero.py
    esperado: rojo
    falla: "techo del hexagono con el agujero de 6,6 en el medio: los hilos terminan en el agujero y quedan sueltos (marana en la placa probeta v4, foto de Fak 22/10 14:33)"
    fuente: "5. 3D/VWA/PATAGONIA - PLANTILLA PERFORADO INSERT/v3 - 2026-10-21 - alineada a la costura (concepto)/generador/casos voladizos (porta-bulon 22-10)/PORTA-BULON FALLO techo con agujero.stl"
    sha256: 51069953c5e096725d3f082f1bfa6757de51415f135aff68c0106886ee336c72
    nota: >-
      Es el rearmado de esa version que dejo generador/porta_bulon_variantes.py (sin los chaflanes), no la malla
      sacada del .3mf de la placa v4.
  - archivo: mal_2_tapita.py
    esperado: rojo
    falla: "techo cerrado con tapita de sacrificio de 0,4 (placa v5 del 22/10): Fak lo marco a las 15:40 con la foto de los porta-bulones de la placa v5"
    fuente: "5. 3D/VWA/PATAGONIA - PLANTILLA PERFORADO INSERT/v3 - 2026-10-21 - alineada a la costura (concepto)/Probeta plaquitas intercambiables (22-10)/PORTA-BULON M6 hexagonal.stl (y .step)"
    sha256: 0a4f0293a3328da21115c510ede2fef51a882fddbdb0ba1c6d1a2f3618188479
    sha256_step: c2e3b09a7b51ff73a3f13e06c279e0dcd4087edd472ec96bc6dcba56648b9238
    nota: >-
      Que es la pieza de la placa v5 se comprobo midiendo: el objeto 4 del .gcode.3mf 'PLACA v5 - 3 plaquitas
      (agujero 7,1, cubo alto, hilera de adentro) + 3 porta-bulones (1h38 51g)' tiene 1644,55 mm3 y este STL 1644,55 mm3
      (caja 22 x 22 x 7,7 los dos). La respuesta guardada del corrector para este caso es OK (puente 10,4): el banco
      la deja en rojo porque la falla es la de la impresora, no la del corrector.
controles:
  - nombre: voladizos
    existe: true
    formato: stl
    opciones: []
formatos: [stl]
respuesta_conocida:
  fuente: "memoria project_seguimientos_con_fecha.md, seguimiento 3d-control-voladizos-antes-de-mandar-viernes"
  texto: "FALLO techo con agujero -> OJO voladizo 3,7; techo cerrado -> OK puente 10,4; puentes escalonados -> OK"
  medido_23_10: >-
    chequeo_voladizos2.py sobre los STL reales: techo con agujero OJO (voladizo 3,7, puente 8,1, z 4,5); tapita de la
    probeta OK (puente 10,4, voladizo 0,0); techo cerrado de 'casos voladizos' OK (puente 10,4); puentes escalonados OK
    (puente 8,1, voladizo 1,0). Reproduce las tres respuestas guardadas. No da '3 OJO': da 1 OJO y 2 OK.
notas: >-
  Solo STL: del techo con agujero y de los puentes escalonados no hay STEP real (no se redibujan para tenerlo).
  El corrector es chequeo_voladizos2.py copiado byte a byte (sha256 08a234e0...), llamado por el envoltorio
  voladizos.py. Pendiente: sacar del .3mf de la placa v4 la malla real del techo con agujero y sumarla como mal_3.
