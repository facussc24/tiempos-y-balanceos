id: 06_palanca_0_60
nombre: "Palanca que gira de 0 a 60 grados sin chocar ni pellizcar"
falla_real:
  - cita: "choque o interferencia, 3 casos (empujador del Top Roll que atraviesa la pared, patas del carro que tocan el marco por una arista, pieza copiada del 3D de Leo)"
    fecha: "21/07 a 21/10/2026"
    fuente: >-
      FALLAS_3D_REALES_23-10.md item 3, sin el caso del tornillo de 30 mm (Fak dijo «va a chocar» creyendo que eran
      30 cm: memoria project_tornillo_cabeza_ancha_impreso.md, 20/10 tarde). P3, P12 y el comentario de gate_giro.py no
      van aca: son propuestas y codigo, no fallas que marco Fak (revision 09).
pedido: |
  Diseñar una palanca que gira de 0 a 60 grados sobre su base (como la palanca de traba del virolador manual del
  20/10) sin tocar nada en ninguna pose y sin que la luz contra la base baje de 25 mm. Entregar base, soporte del eje y
  palanca por separado, con el eje y el rango.
piezas:
  - archivo: bien.py
    esperado: verde
  - archivo: mal_1_choca_a_35.py
    esperado: rojo
    falla: "un travesaño fijo de la base en el camino: choca en las poses del medio (~25 a 45 grados) y en 0 y 60 esta libre"
  - archivo: mal_2_pellizco_15_a_50.py
    esperado: rojo
    falla: "no choca, pero a 50 grados pasa a 15 mm de un bloque fijo (pinza de dedo)"
  - archivo: mal_3_choca_a_60.py
    esperado: rojo
    falla: "choca en el extremo de 60 grados"
controles:
  - nombre: barrido_palanca
    existe: true
    formato: stl
formatos: [stl, step]
notas: |
  - Piezas de ENSAYO del banco (medidas sin fuente de Barack).
  - El json trae "movil", "junta" (el soporte del eje: contra el se mide el choque pero no la luz, que es constante y
    se juzga aparte), "eje" {origen, dir} y "rango_grados". Giro positivo = regla de la mano derecha alrededor de dir;
    con dir (0,-1,0) la palanca sube.
  - Valor gemelo del control: el mismo mal_1 con --paso 60 (mira solo 0 y 60) tiene que dar VERDE; con el paso de 2,5
    da ROJO. Esa diferencia es lo que el ejercicio enseña.
  - Cada mal_*.py verifica sobre lo construido que choca (o pellizca) en la pose que dice y que esta libre donde dice.
  - No se envolvio gate_giro.py: barre 0 a 360 grados sobre nubes de puntos y no acepta un rango; aca el choque es el
    volumen exacto del booleano y la luz la distancia exacta.
