name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Gate 0: candado del repo PUBLICO. Bloqueante desde el dia uno.
  # No necesita secretos ni red, por eso no se puede saltear ni desactivar de hecho
  # (a diferencia de un hook local, que `git push --no-verify` ignora).
  # CHECK-1: credenciales de dev-login en el env de un build (Vite las inlinea en el
  # bundle publicado). CHECK-2: memoria o documentos internos versionados.
  repo-publico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selftest del gate (un gate que no se prueba roto no es un gate)
        run: node scripts/_gateRepoPublico.mjs --selftest
      - name: Gate repo publico
        run: node scripts/_gateRepoPublico.mjs

  # Gate 1: TypeScript typecheck. Blocking — if types break, we do not deploy.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Strict typecheck for core/ and utils/repositories/. Blocking desde 2026-08-30:
      # los 25 errores restantes (todos codigo muerto TS6133) se limpiaron ese dia.
      - name: Run strict typecheck
        run: npm run typecheck:strict

  # Gate 2: Vitest suite. Runs in parallel with typecheck. BLOCKING desde 2026-08-30:
  # la precondicion del viejo TODO (subir testTimeout) ya estaba cumplida en
  # vitest.config.ts (testTimeout/hookTimeout 15000, medido 2026-07-30), y la suite
  # completa paso local ese dia: 3708 tests / 0 fallos / exit 0. Los skipped son
  # describe.skip a proposito.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # __tests__/scripts/pdfBomArb.test.mjs corre scripts/_pdfBomArb.py, que importa
      # fitz (PyMuPDF). Por diseño ese test NO se saltea si falta el entorno ("un test
      # salteado es un verde vacio"), asi que el runner necesita Python + PyMuPDF.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF
      - run: npm ci
      - name: Run vitest
        run: npx vitest run

  # Gate 3: ESLint. En local solo corre via husky pre-commit (lint-staged), que un
  # `git push --no-verify` saltea — aca no hay como saltearlo.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Build + deploy solo corre si TODOS los gates pasaron (todos bloqueantes
  # desde 2026-08-30: un rojo en tests, tipos o lint frena el deploy).
  build-and-deploy:
    needs: [repo-publico, typecheck, test, lint]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # SEGURIDAD (2026-07-30): VITE_AUTO_LOGIN_EMAIL y VITE_AUTO_LOGIN_PASSWORD
      # NO se pasan al build de produccion. Vite inlinea todo `import.meta.env.VITE_*`
      # en el bundle, y el bundle se publica en GitHub Pages, que es publico: la
      # contrasena de la cuenta de Supabase quedaba legible por cualquiera
      # (verificado bajando assets/index-C8NUY4aA.js el 2026-07-30).
      # El boton "Acceso rapido (dev)" de components/auth/LoginPage.tsx NO se toco:
      # sigue funcionando en local con .env.local, y en produccion simplemente no se
      # renderiza porque la condicion de la linea 127 queda falsa. Ver .claude/rules/dev-login.md.
      # NO volver a agregar estas dos variables aca.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
