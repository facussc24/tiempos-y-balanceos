name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Gate 0: candado del repo PUBLICO. Bloqueante desde el dia uno.
  # No necesita secretos ni red, por eso no se puede saltear ni desactivar de hecho
  # (a diferencia de un hook local, que `git push --no-verify` ignora).
  # CHECK-1: credenciales de dev-login en el env de un build (Vite las inlinea en el
  # bundle publicado). CHECK-2: memoria o documentos internos versionados.
  repo-publico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selftest del gate (un gate que no se prueba roto no es un gate)
        run: node scripts/_gateRepoPublico.mjs --selftest
      - name: Gate repo publico
        run: node scripts/_gateRepoPublico.mjs

  # Gate 1: TypeScript typecheck. Blocking — if types break, we do not deploy.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Strict typecheck baseline for core/ and utils/repositories/.
      # Non-blocking for visibility while legacy `any`/unused code is cleaned up.
      # TODO: enforce blocking when strict errors reach 0
      - name: Run strict typecheck (non-blocking baseline)
        run: npm run typecheck:strict
        continue-on-error: true

  # Gate 2: Vitest suite. Runs in parallel with typecheck.
  # Corrida local 2026-07-30: 235 archivos pasan / 1 skipped, 3329 tests pasan / 8 skipped,
  # exit 0. Los "4 failing" del TODO de abril ya no reproducen; los 8 skipped son
  # describe.skip a proposito (audit_fixes.test.ts:66 y :150, concurrency.test.ts:50,
  # station_a11y.test.tsx:8).
  # TODO: sacar `continue-on-error` DESPUES de subir testTimeout y separar jsdom de los
  # tests de logica pura. Medido: `npx vitest run --coverage` todavia falla por timeout en
  # database.test.ts > closeDatabase (aislado tarda 2638ms de un presupuesto de 5000ms),
  # asi que hoy el candado seria intermitente en los runners de GitHub.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run vitest
        run: npx vitest run
        continue-on-error: true

  # Build + deploy only runs if typecheck passed. `test` is not a hard gate
  # yet (continue-on-error) but appears in the dependency chain so its status
  # is visible on every deploy.
  build-and-deploy:
    needs: [repo-publico, typecheck, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # SEGURIDAD (2026-07-30): VITE_AUTO_LOGIN_EMAIL y VITE_AUTO_LOGIN_PASSWORD
      # NO se pasan al build de produccion. Vite inlinea todo `import.meta.env.VITE_*`
      # en el bundle, y el bundle se publica en GitHub Pages, que es publico: la
      # contrasena de la cuenta de Supabase quedaba legible por cualquiera
      # (verificado bajando assets/index-C8NUY4aA.js el 2026-07-30).
      # El boton "Acceso rapido (dev)" de components/auth/LoginPage.tsx NO se toco:
      # sigue funcionando en local con .env.local, y en produccion simplemente no se
      # renderiza porque la condicion de la linea 127 queda falsa. Ver .claude/rules/dev-login.md.
      # NO volver a agregar estas dos variables aca.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
